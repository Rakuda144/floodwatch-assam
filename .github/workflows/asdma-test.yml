# .github/workflows/asdma-test.yml
# Manual test: downloads one day's flood report (through the Mumbai relay),
# reads its tables, and attaches the results to the run.
name: ASDMA report test

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Report date, YYYY-MM-DD (leave empty for today)"
        required: false
        default: ""

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install poppler (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Try to download the report
        env:
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: node scripts/fetch-asdma.mjs ${{ github.event.inputs.date }}

      - name: Extract text and parse
        run: |
          shopt -s nullglob
          pdfs=(out/Daily_Flood_Report_*.pdf)
          if [ ${#pdfs[@]} -eq 0 ]; then
            echo "No PDF downloaded, nothing to parse"
            exit 0
          fi
          pdftotext -layout "${pdfs[0]}" out/report.txt
          node scripts/parse-asdma.mjs out/report.txt out/asdma.json

      - name: Save data only if all checks passed
        if: success()
        run: |
          if [ -f out/asdma.json ]; then
            mkdir -p data
            cp out/asdma.json data/asdma.json
          fi

      - name: Commit district data if it changed
        if: success()
        run: |
          git config user.name "floodwatch-bot"
          git config user.email "actions@github.com"
          git add data/asdma.json
          git diff --quiet --cached || (git commit -m "Update ASDMA district data" && git push)

      - name: Attach result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asdma-test
          path: out/
