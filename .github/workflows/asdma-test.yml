# .github/workflows/asdma-test.yml
# Manual test: tries to download one day's flood report and attaches it to the run.
name: ASDMA report test

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Report date, YYYY-MM-DD (leave empty for today)"
        required: false
        default: ""

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Try to download the report
        run: node scripts/fetch-asdma.mjs ${{ github.event.inputs.date }}

      - name: Attach result (not committed to the repo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asdma-test
          path: out/
