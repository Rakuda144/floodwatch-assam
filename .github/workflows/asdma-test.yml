# .github/workflows/asdma-test.yml
# Daily ASDMA district report: finds the newest report (today, or up to 6 days back),
# reads its tables, saves data/asdma.json when all checks pass, and attaches the output.
name: ASDMA daily report

on:
  schedule:
    # 13:00 IST and 19:00 IST (07:30 and 13:30 UTC)
    - cron: "30 7 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Report date, YYYY-MM-DD (leave empty to find the newest report)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install poppler (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Find the newest report (today, then up to 6 days back)
        env:
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          MANUAL_DATE: ${{ github.event.inputs.date }}
        run: |
          shopt -s nullglob
          if [ -n "$MANUAL_DATE" ]; then
            dates="$MANUAL_DATE"
          else
            dates=$(for i in 0 1 2 3 4 5 6; do TZ=Asia/Kolkata date -d "-$i day" +%F; done)
          fi
          for d in $dates; do
            node scripts/fetch-asdma.mjs "$d" || true
            pdfs=(out/Daily_Flood_Report_*.pdf)
            if [ ${#pdfs[@]} -gt 0 ]; then
              echo "Using the report for $d"
              break
            fi
          done
          pdfs=(out/Daily_Flood_Report_*.pdf)
          if [ ${#pdfs[@]} -eq 0 ]; then
            echo "No report found in the checked dates; keeping the existing data"
          fi

      - name: Extract text and parse
        run: |
          shopt -s nullglob
          pdfs=(out/Daily_Flood_Report_*.pdf)
          if [ ${#pdfs[@]} -eq 0 ]; then
            exit 0
          fi
          pdftotext -layout "${pdfs[0]}" out/report.txt
          node scripts/parse-asdma.mjs out/report.txt out/asdma.json

      - name: Save data only if all checks passed
        if: success()
        run: |
          if [ -f out/asdma.json ]; then
            mkdir -p data
            cp out/asdma.json data/asdma.json
          fi

      - name: Commit district data if it changed
        if: success()
        run: |
          git config user.name "floodwatch-bot"
          git config user.email "actions@github.com"
          git add data/asdma.json
          git diff --quiet --cached || (git commit -m "Update ASDMA district data" && git push)

      - name: Attach result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asdma-daily
          path: out/
